<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gene-pool mixer</title>
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<style>
/* Shared molecular palette: builder + lecture. Inlined by both builds. */
:root {
  --bg:#f4f6f7; --surface:#ffffff; --ink:#1b2930; --muted:#586a74;
  --line:#d3dce1; --tmpl:#2b3a43; --dna:#1d6b87; --dna-2:#1d6b87;
  --dna-ink:#ffffff; --rna:#c84b25; --rna-2:#c84b25; --rna-ink:#ffffff;
  --accent:#1d6b87; --ok:#2b7a4b; --ok-bg:#e8f4ec; --bad:#b3261e;
  --warn:#8a5d00; --focus:#e0a100; --slot:#e7eef1; --target:#7a4fb3;
  --font-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark) {
  :root:not([data-theme="light"]) {
    --bg:#11171b; --surface:#182126; --ink:#e2eaee; --muted:#aabac3;
    --line:#384954; --tmpl:#c7d2d8; --dna:#4cb0cf; --dna-2:#4cb0cf;
    --dna-ink:#0d1a20; --rna:#ef7f5a; --rna-2:#ef7f5a; --rna-ink:#1c0d07;
    --accent:#4cb0cf; --ok:#5cc28a; --ok-bg:#16281e; --bad:#f2766b;
    --warn:#e3b448; --focus:#f2c14e; --slot:#1f2b31; --target:#b996ea;
    color-scheme:dark;
  }
}
:root[data-theme="dark"] {
  --bg:#11171b; --surface:#182126; --ink:#e2eaee; --muted:#aabac3;
  --line:#384954; --tmpl:#c7d2d8; --dna:#4cb0cf; --dna-2:#4cb0cf;
  --dna-ink:#0d1a20; --rna:#ef7f5a; --rna-2:#ef7f5a; --rna-ink:#1c0d07;
  --accent:#4cb0cf; --ok:#5cc28a; --ok-bg:#16281e; --bad:#f2766b;
  --warn:#e3b448; --focus:#f2c14e; --slot:#1f2b31; --target:#b996ea;
  color-scheme:dark;
}
.material-key { display:flex; flex-wrap:wrap; align-items:center; gap:10px 22px; font-size:13px; color:var(--muted); }
.material-key span { display:inline-flex; gap:8px; align-items:center; }
.swatch { display:inline-block; width:26px; height:10px; background:var(--dna); border-radius:2px; }
.swatch.parent { height:4px; background:var(--tmpl); }
.swatch.rna { background:repeating-linear-gradient(135deg,transparent 0 5px,#ffffff80 5px 7px),var(--rna); }
:focus-visible { outline:3px solid var(--focus); outline-offset:3px; }
@media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; transition:none!important; scroll-behavior:auto!important; } }

/* BISC 202 tool kit: layout shared by the step-by-step interactive tools.
   Inlined after replication_shared/theme.css by tool_kit/build_tool.py. */
:root { --gAA: var(--dna); --gAa: var(--target); --gaa: var(--rna); --hw: var(--muted); }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
.wrap { max-width: 1060px; margin: 0 auto; padding-block: 16px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 12px; min-width: 0; }
.wrap > * { min-width: 0; }
header { display: grid; gap: 4px; }
h1 { font-size: 1.35rem; font-weight: 600; margin: 0; text-wrap: balance; }
h2 { font-size: 1rem; margin: 0; }
h3 { font-size: 0.95rem; margin: 0; }
.eyebrow { font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.steps { display: flex; flex-wrap: wrap; gap: 6px 4px; list-style: none; margin: 0; padding: 0; align-items: center; }
.steps li { display: flex; align-items: center; gap: 6px; font-size: 0.88rem; color: var(--muted); }
.steps li + li::before { content: ""; width: 22px; height: 1px; background: var(--line); margin-right: 4px; }
.steps .dot { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-family: var(--font-mono); font-size: 0.75rem; }
.steps li.now { color: var(--ink); font-weight: 600; }
.steps li.now .dot { border-color: var(--accent); color: var(--accent); }
.steps li.done .dot { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.brief { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; }
.brief p { margin: 0; max-width: 78ch; }
.brief .q { font-weight: 600; }
.brief .given { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); }
.task { background: var(--surface); border: 1px solid var(--accent); border-left: 4px solid var(--accent); border-radius: 8px; padding: 10px 12px; }
.task p { margin: 0; max-width: 78ch; }
.stage { display: grid; gap: 12px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 10px; min-width: 0; }
.panel > p, .panel .note { margin: 0; max-width: 78ch; }
.note { font-size: 0.85rem; color: var(--muted); }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.btn { font: inherit; font-size: 0.9rem; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--dna-ink); font-weight: 600; }
.btn[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.btn.small { font-size: 0.8rem; padding: 4px 9px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.spacer { flex: 1 1 auto; }
.toolbar { position: sticky; bottom: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px; background: var(--surface); border: 1px solid var(--accent); border-radius: 8px; }
#btnCheck { min-width: 180px; }

/* answers */
.answer-options { display: grid; gap: 5px; min-width: 0; margin: 0; padding: 0; border: 0; }
.answer-options legend { font-size: 0.92rem; font-weight: 600; margin-bottom: 4px; padding: 0; max-width: 78ch; }
.answer-options label { display: flex; gap: 9px; align-items: flex-start; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font-size: 0.9rem; background: var(--surface); }
.answer-options label:has(input:checked) { border-color: var(--accent); background: var(--slot); }
.answer-options label.flag { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 8%, transparent); }
.answer-options label.right { border-color: var(--ok); background: var(--ok-bg); }
.answer-options input { flex-shrink: 0; margin-top: 4px; accent-color: var(--accent); }
.answer-options.thumbs { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.answer-options.thumbs label { flex-direction: column; align-items: stretch; gap: 4px; }
.answer-options.thumbs label svg { width: 100%; height: auto; display: block; }
.answer-options.thumbs label .tl { display: flex; gap: 8px; align-items: center; }
.answer-options.thumbs input { margin-top: 0; }
.nums { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr)); gap: 8px 12px; }
label.num { display: grid; gap: 3px; font-size: 0.85rem; }
label.num span.lab { font-weight: 600; }
label.num input { font: inherit; font-family: var(--font-mono); font-size: 0.95rem; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); width: 100%; min-width: 0; }
label.num input:disabled { color: var(--ink); background: var(--slot); }
label.num.flag input { border-color: var(--bad); box-shadow: 0 0 0 1px var(--bad); }
label.num.right input { border-color: var(--ok); }
label.num .hint { font-size: 0.75rem; color: var(--muted); }
label.range { display: grid; gap: 2px; font-size: 0.85rem; }
label.range .rl { display: flex; justify-content: space-between; gap: 8px; }
label.range output { font-family: var(--font-mono); font-weight: 600; }
label.range input { width: 100%; accent-color: var(--accent); }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; }

/* tables */
.tablewrap { overflow-x: auto; }
table.data { border-collapse: collapse; font-size: 0.9rem; min-width: 100%; }
table.data th, table.data td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
table.data th { font-size: 0.78rem; color: var(--muted); font-weight: 600; background: var(--bg); }
table.data th:first-child, table.data td:first-child { text-align: left; }
table.data td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
table.data tr:last-child td { border-bottom: 0; }

/* charts */
svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font-family: var(--font-body); font-size: 11px; fill: var(--muted); }
.chart text.lbl { fill: var(--ink); font-size: 12px; }
.chart text.big { fill: var(--ink); font-size: 13px; font-weight: 600; }
.chart .axis { stroke: var(--line); stroke-width: 1; }
.chart .grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 3; opacity: 0.7; }
.chart .tick { stroke: var(--muted); }
.chart .ln { fill: none; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .ln.thin { stroke-width: 1.2; opacity: 0.75; }
.chart .ref { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 6 4; }
.chart .hwbox { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 4 3; }
.chart .cAA { fill: var(--gAA); stroke: var(--gAA); }
.chart .cAa { fill: var(--gAa); stroke: var(--gAa); }
.chart .caa { fill: var(--gaa); stroke: var(--gaa); }
.chart .sAA { stroke: var(--gAA); }
.chart .sAa { stroke: var(--gAa); }
.chart .saa { stroke: var(--gaa); }
.chart .sacc { stroke: var(--accent); }
.chart .sink { stroke: var(--ink); }
.chart .face { fill: var(--surface); }
.chart .muted { fill: var(--muted); }
.chart .shade { fill: var(--slot); }
.chart .draw { stroke-dasharray: 2000; stroke-dashoffset: 2000; animation: kit-draw 1.6s ease-out forwards; }
@keyframes kit-draw { to { stroke-dashoffset: 0; } }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 0.8rem; color: var(--muted); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend i { display: inline-block; width: 14px; height: 10px; border-radius: 2px; }
.legend i.line { height: 3px; }
.legend i.dash { height: 0; border-top: 2px dashed var(--ink); background: none !important; }
.readout { display: flex; flex-wrap: wrap; gap: 6px 16px; font-family: var(--font-mono); font-size: 0.85rem; }
.readout b { font-weight: 600; }

/* feedback */
.feedback { display: grid; gap: 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; }
.card.bad { border-left-color: var(--bad); }
.card.ok { border-left-color: var(--ok); }
.card.win { border: 1px solid var(--ok); border-left: 4px solid var(--ok); background: var(--ok-bg); }
.card.info { border-left-color: var(--warn); }
.card h3 { font-size: 0.98rem; margin: 0; }
.card p { margin: 0; max-width: 78ch; }
.card .learn { font-size: 0.8rem; color: var(--muted); }
.code { font-family: var(--font-mono); font-size: 1.05rem; letter-spacing: 0.06em; padding: 6px 10px; border: 1px dashed var(--accent); border-radius: 6px; user-select: all; -webkit-user-select: all; overflow-wrap: anywhere; }
footer { font-size: 0.8rem; color: var(--muted); display: grid; gap: 2px; }
footer p { margin: 0; max-width: 80ch; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 640px) {
  h1 { font-size: 1.15rem; }
  .toolbar .spacer { display: none; }
  #btnCheck { flex: 1 1 100%; }
  .panel { padding: 10px; }
  .chart text { font-size: 13px; }
}

</style>
<script>window.TOOL_CONFIG = {"mode": "check"};</script>

<body>
<script>
/* BISC 202 tool kit: the step engine shared by the interactive tools.
   Designed by Tegan Williams for BISC 202 at SFU.

   A tool supplies two objects:
     CORE (pure logic, no DOM, testable in Node):
       { id, prefix, make(seed) -> case (case.variant: 0-35),
         steps: [{ name, bits: {TAG: 1, ...}, judge(C, A) -> [{tag, note?, field?}], model(C, A), wrong(C, A) -> tag }],
         cards: {TAG: {title, text, learn}}, anchors() -> [[name, got, want, tol]] }
       Bits are numbered per step: at most 15 per step (3 base-36 characters), or 20 if CORE.codeWidth = 4.
     UI (DOM):
       { eyebrow, title, footer: [..], brief(C) -> {q, text, given},
         steps: [{ task(C), render(root, C, A, ctx), reveal?(root, C, A, ctx), win(C, A) }],
         done(root, C) }
   Kit.run(CORE, UI) builds the page.
   ctx: { solved, mode, change(), rerender(), flag(field) -> "flag" | "right" | "" , seed } */
(function (root) {
"use strict";
const NS = "http://www.w3.org/2000/svg";

/* ---------- numbers ---------- */
function rng(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function rtools(R) {
  return {
    ri: (a, b) => a + Math.floor(R() * (b - a + 1)),
    rf: (a, b) => a + R() * (b - a),
    pick: (arr) => arr[Math.floor(R() * arr.length)],
    shuffle: (arr) => { const o = arr.slice(); for (let i = o.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [o[i], o[j]] = [o[j], o[i]]; } return o; },
    binom: (n, p) => { let k = 0; for (let i = 0; i < n; i++) if (R() < p) k++; return k; },
  };
}
/* Accepts 0.25, .25, 25%, 1/16, 1.4e-5, 1.4x10^-5, 1.4×10-5, 1 in 40. */
function parseNum(s) {
  if (s == null) return NaN;
  let t = String(s).trim().toLowerCase().replace(/\s+/g, "").replace(/,/g, "").replace(/[−–]/g, "-").replace(/⁻/g, "-")
    .replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/g, (c) => "⁰¹²³⁴⁵⁶⁷⁸⁹".indexOf(c));
  if (!t) return NaN;
  let m = t.match(/^1in(\d*\.?\d+)$/);
  if (m) return 1 / parseFloat(m[1]);
  let pct = false;
  if (t.endsWith("%")) { pct = true; t = t.slice(0, -1); }
  let v;
  if ((m = t.match(/^([-+]?\d*\.?\d+)[x×*]10\^?([-+]?\d+)$/))) v = parseFloat(m[1]) * Math.pow(10, parseInt(m[2], 10));
  else if ((m = t.match(/^([-+]?\d*\.?\d+)\/(\d*\.?\d+)$/))) v = parseFloat(m[1]) / parseFloat(m[2]);
  else if (/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/.test(t)) v = parseFloat(t);
  else return NaN;
  return pct ? v / 100 : v;
}
function near(v, target, tol) {
  if (typeof v !== "number" || !isFinite(v)) return false;
  const d = Math.abs(v - target);
  return (tol.abs != null && d <= tol.abs + 1e-12) || (tol.rel != null && d <= Math.abs(target) * tol.rel + 1e-15);
}
function fmt(v, dp) { return Number(v).toFixed(dp); }
function sig(v, n) {
  if (v === 0) return "0";
  const a = Math.abs(v);
  if (a < 1e-3 || a >= 1e6) { const e = Math.floor(Math.log10(a)); const m = v / Math.pow(10, e); return Number(m.toPrecision(n)) + " × 10" + sup(e); }
  return String(Number(v.toPrecision(n)));
}
function sup(e) { return String(e).replace(/-/g, "⁻").replace(/\d/g, (d) => "⁰¹²³⁴⁵⁶⁷⁸⁹"[d]); }
function frac(v) { // 1/16 style when exact power of two
  const n = Math.round(1 / v);
  return Math.abs(1 / n - v) < 1e-9 ? "1/" + n : sig(v, 3);
}

function genTicks(G) { const st = G <= 10 ? (G <= 5 ? 1 : 2) : G <= 30 ? 10 : G <= 60 ? 20 : G <= 100 ? 25 : 50; const a = []; for (let v = 0; v <= G + 1e-9; v += st) a.push(v); return a; }

/* ---------- DOM ---------- */
function setAttrs(e, attrs) {
  if (!attrs) return;
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "text") e.textContent = v;
    else if (k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2), v);
    else if (k === "style" && typeof v === "object") Object.assign(e.style, v);
    else e.setAttribute(k, v === true ? "" : v);
  }
}
function append(e, kids) {
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
}
function el(tag, attrs, ...kids) { const e = document.createElement(tag); setAttrs(e, attrs); return append(e, kids); }
function s(tag, attrs, ...kids) { const e = document.createElementNS(NS, tag); setAttrs(e, attrs); return append(e, kids); }
function clear(e) { while (e.firstChild) e.removeChild(e.firstChild); return e; }
function svg(w, h, label, cls, scale) { return s("svg", { viewBox: `0 0 ${w} ${h}`, class: "chart " + (cls || ""), role: "img", "aria-label": label, style: `max-width:${Math.round(w * (scale || 1.15))}px` }); }

let uid = 0;
/* Radio group. options: [{value, label (string or node)}]. marks: {value: "flag"|"right"} */
function choice({ legend, options, value, onChange, disabled, marks, thumbs, name }) {
  const nm = name || "c" + (++uid);
  const fs = el("fieldset", { class: "answer-options" + (thumbs ? " thumbs" : "") });
  if (legend) fs.append(el("legend", null, legend));
  for (const o of options) {
    const lab = el("label", { class: (marks && marks[o.value]) || "" });
    const r = el("input", { type: "radio", name: nm, value: o.value });
    r.checked = value === o.value; r.disabled = !!disabled;
    r.addEventListener("change", () => onChange(o.value));
    if (thumbs) lab.append(o.label, el("span", { class: "tl" }, r, o.caption || ""));
    else lab.append(r, typeof o.label === "string" ? el("span", null, o.label) : o.label);
    fs.append(lab);
  }
  return fs;
}
function number({ label, value, onInput, hint, disabled, mark, placeholder, aria }) {
  const inp = el("input", { type: "text", inputmode: "decimal", autocomplete: "off", spellcheck: "false", placeholder: placeholder || "", "aria-label": aria || null });
  inp.value = value == null ? "" : value; inp.disabled = !!disabled;
  inp.addEventListener("input", () => onInput(inp.value));
  return el("label", { class: "num " + (mark || "") }, el("span", { class: "lab" }, label), inp, hint ? el("span", { class: "hint" }, hint) : null);
}
function range({ label, min, max, step, value, onInput, format }) {
  const out = el("output", null, format ? format(value) : value);
  const inp = el("input", { type: "range", min, max, step, value });
  inp.value = value;
  inp.addEventListener("input", () => { const v = parseFloat(inp.value); out.textContent = format ? format(v) : v; onInput(v); });
  return el("label", { class: "range" }, el("span", { class: "rl" }, el("span", null, label), out), inp);
}
function legend(items) { // [[cls or color, text, kind]]
  return el("div", { class: "legend" }, items.map(([c, t, kind]) => {
    const i = el("i", { class: kind || "" }); i.style.background = c.startsWith("var") || c.startsWith("#") ? c : `var(--${c})`;
    return el("span", null, i, t);
  }));
}

/* Axes. o = {x, y, w, h, xmin, xmax, ymin, ymax, xticks:[..], yticks:[..], xfmt, yfmt, xlabel, ylabel, ylog, grid} */
function axes(g, o) {
  const ly = (v) => Math.log10(Math.max(v, 1e-300));
  const sx = (v) => o.x + (v - o.xmin) / (o.xmax - o.xmin) * o.w;
  const sy = o.ylog ? (v) => o.y + o.h - (ly(v) - ly(o.ymin)) / (ly(o.ymax) - ly(o.ymin)) * o.h
                    : (v) => o.y + o.h - (v - o.ymin) / (o.ymax - o.ymin) * o.h;
  g.append(s("line", { class: "axis", x1: o.x, x2: o.x + o.w, y1: o.y + o.h, y2: o.y + o.h }));
  g.append(s("line", { class: "axis", x1: o.x, x2: o.x, y1: o.y, y2: o.y + o.h }));
  for (const t of o.xticks || []) {
    g.append(s("line", { class: "tick", x1: sx(t), x2: sx(t), y1: o.y + o.h, y2: o.y + o.h + 4 }));
    g.append(s("text", { x: sx(t), y: o.y + o.h + 16, "text-anchor": "middle" }, o.xfmt ? o.xfmt(t) : t));
  }
  for (const t of o.yticks || []) {
    if (o.grid !== false) g.append(s("line", { class: "grid", x1: o.x, x2: o.x + o.w, y1: sy(t), y2: sy(t) }));
    g.append(s("text", { x: o.x - 6, y: sy(t) + 4, "text-anchor": "end" }, o.yfmt ? o.yfmt(t) : t));
  }

  HOMTWO: { title: "A homozygote carries two copies", text: "Each AA individual contributes two A copies and each Aa individual one. A copies = 2 × (number of AA) + (number of Aa).", learn: LEARN_COUNT },
  COUNT: { title: "Recount the copies", text: "Add up the copies class by class: two per homozygote, one of each allele per heterozygote.", learn: LEARN_COUNT },
  PFREQ: { title: "p is not the frequency of AA individuals", text: "Heterozygotes carry A copies too. p = (2 × AA + Aa) / 2N, or equivalently p = freq(AA) + ½ freq(Aa).", learn: LEARN_COUNT + " (slide 6, CCR5)" },
  CALC: { title: "Check the division", text: "", learn: LEARN_COUNT },
  XTWO: { title: "Males carry one X", text: "For an X-linked gene each female carries two copies and each male one. Total copies = 2 × females + males.", learn: LEARN_X },
  HWCALC: { title: "Use p², 2pq and q²", text: "Under random mating, an offspring's two gametes are drawn independently from the gene pool: AA = p × p, Aa = 2pq (A from either parent), aa = q × q.", learn: LEARN_HW },
  SAME: { title: "Random mating resets the genotype frequencies", text: "These are the parents' genotype frequencies. The offspring's genotypes depend only on the allele frequencies in the gene pool, so they are p², 2pq, q² whatever the parents' genotypes were.", learn: LEARN_HW },
  MENDEL: { title: "1 : 2 : 1 is one cross, not a population", text: "1/4 : 1/2 : 1/4 is what Aa × Aa gives. A population mating at random gives p², 2pq, q², which is 1 : 2 : 1 only when p = q = 0.5.", learn: LEARN_HW },
  SUM: { title: "The three frequencies must add to 1", text: "p² + 2pq + q² = (p + q)² = 1.", learn: LEARN_HW },
  TWOPQ: { title: "Heterozygotes are 2pq, not pq", text: "An Aa offspring can get A from the egg and a from the sperm, or the other way round: pq + qp = 2pq.", learn: LEARN_HW },
  XSQ: { title: "A male's phenotype shows his one allele", text: "A male has one X, so the fraction of males showing an X-linked recessive trait is q itself, not q².", learn: LEARN_X },
  XWOMEN: { title: "Females need two recessive copies", text: "A female shows an X-linked recessive trait only as XᵃXᵃ: frequency q². Heterozygous females (2pq) are carriers.", learn: LEARN_X },
  MC85: { title: "Dominance does not set frequency", text: "Dominance describes how a heterozygote looks, not how alleles are passed on. With no force acting, allele frequencies do not change at all: that is the Hardy–Weinberg null model.", learn: "Week 13 Tuesday lecture, Dominance does not set frequency (slide 7) · Klug §26.2 (p. 624)" },
  HALF: { title: "Nothing pulls p towards 0.5", text: "Random mating shuffles the same copies into new genotypes. Without selection, drift, migration or mutation, p stays where it is.", learn: LEARN_HW },
  FALLS: { title: "Copies in heterozygotes are still copies", text: "A copies in heterozygotes are passed on exactly as often as those in homozygotes: each with probability ½. p does not change.", learn: LEARN_HW },
  SLOW: { title: "One generation is enough", text: "For an autosomal locus, one generation of random mating gives p², 2pq, q², and later generations of random mating keep them there.", learn: LEARN_HW },
  PARENTS: { title: "The old genotype frequencies are gone", text: "Once the copies are shuffled through a gene pool, nothing remembers how they were paired in the parents.", learn: LEARN_HW },
};

function anchors() {
  return [
    ["CCR5 Klug Table 26.2 (79, 20, 1)", pFrom(79, 20, 1), 0.89, 1e-9],
    ["tutorial warm-up 36/48/16", pFrom(36, 48, 16), 0.6, 1e-9],
    ["all homozygotes 50/0/50 -> Aa offspring", hw(pFrom(50, 0, 50))[1], 0.5, 1e-9],
    ["ABO type O 0.26 -> r", Math.sqrt(0.26), 0.51, 0.005],
  ];
}
return { id: "popgen_gene_pool", prefix: "P", make, steps, cards, anchors, Q3, hw, totalCopies, aCopies };
})();
/* CORE END */

/* ---------------- UI ---------------- */
(() => {
const K = Kit, { el, s } = K;
const GT = ["AA", "Aa", "aa"];

function peopleSVG(C, poured) {
  // Groups of figures, one row group per genotype class, beads below each figure.
  const groups = C.x
    ? [["XᴬXᴬ ♀", C.nFAA, "F", "AA"], ["XᴬXᵃ ♀", C.nFAa, "F", "Aa"], ["XᵃXᵃ ♀", C.nFaa, "F", "aa"], ["XᴬY ♂", C.nMA, "M", "A"], ["XᵃY ♂", C.nMa, "M", "a"]]
    : [["AA", C.nAA, "", "AA"], ["Aa", C.nAa, "", "Aa"], ["aa", C.naa, "", "aa"]];
  const per = 12, cw = 30, ch = 52, left = 70, W = left + per * cw + 10;
  let y = 6; const rows = [];
  for (const g of groups) { if (!g[1]) continue; const nr = Math.ceil(g[1] / per); rows.push([g, y]); y += nr * ch + 8; }
  const jarTop = y + 18, T = CORE.totalCopies(C), AC = CORE.aCopies(C);
  const perRow = Math.floor(((W - left) / 2 - 14) / 10), jarRows = Math.ceil(Math.max(AC, T - AC) / perRow);
  const H = jarTop + 30 + jarRows * 11 + 30;
  const svg = K.svg(W, H, "Each individual drawn with its allele copies as beads. Blue beads are A, orange beads are a.", "people" + (poured ? " poured" : ""));
  const beads = [];
  for (const [g, gy] of rows) {
    svg.append(s("text", { x: 0, y: gy + 26, class: "grp" }, g[0]), s("text", { x: 0, y: gy + 41 }, g[1] + (g[1] === 1 ? " individual" : " individuals")));
    for (let i = 0; i < g[1]; i++) {
      const cx = left + (i % per) * cw + cw / 2, top = gy + Math.floor(i / per) * ch;
      const fig = s("g", { class: "fig" });
      fig.append(s("circle", { class: "head", cx, cy: top + 7, r: 5 }));
      if (g[2] === "M") fig.append(s("rect", { class: "body", x: cx - 6, y: top + 14, width: 12, height: 15, rx: 1 }));
      else if (g[2] === "F") fig.append(s("path", { class: "body", d: `M${cx} ${top + 13} L${cx + 8} ${top + 29} L${cx - 8} ${top + 29} Z` }));
      else fig.append(s("rect", { class: "body", x: cx - 6, y: top + 14, width: 12, height: 15, rx: 5 }));
      svg.append(fig);
      const alle = g[3].split("");
      alle.forEach((a, k) => {
        const bx = alle.length === 2 ? cx - 6 + k * 12 : cx, by = top + 38;
        const b = s("circle", { class: "bead " + a, cx: bx, cy: by, r: 5 });
        beads.push([b, a, bx, by]); svg.append(b);
      });
    }
  }
  // the jar (gene pool)
  svg.append(s("text", { x: 0, y: jarTop + 4, class: "grp" }, "Gene pool"), s("text", { x: 0, y: jarTop + 19 }, T + " copies"));
  svg.append(s("path", { class: "jar", d: `M${left - 6} ${jarTop + 22} L${left - 6} ${H - 8} L${W - 6} ${H - 8} L${W - 6} ${jarTop + 22}` }));
  let iA = 0, ia = 0;
  for (const [b, a, bx, by] of beads) {
    const k = a === "A" ? iA++ : ia++;
    const half = (W - left) / 2;
    const tx = left + (a === "A" ? 0 : half) + 8 + (k % perRow) * 10 - 4, ty = H - 16 - Math.floor(k / perRow) * 11;
    b.dataset.tx = tx - bx; b.dataset.ty = ty - by;
  }
  if (poured) {
    svg.append(s("text", { x: left + 4, y: jarTop + 14, class: "lbl" }, "A: " + AC + " copies"), s("text", { x: left + (W - left) / 2 + 4, y: jarTop + 14, class: "lbl" }, "a: " + (T - AC) + " copies"));
    requestAnimationFrame(() => requestAnimationFrame(() => beads.forEach(([b], i) => { b.style.transitionDelay = (i * 12) + "ms"; b.style.transform = `translate(${b.dataset.tx}px, ${b.dataset.ty}px)`; })));
  }
  return svg;
}

function bars(groups, label) {
  // groups: [{name, vals:[AA,Aa,aa], hw:[..]?}]
  const W = 520, H = 230, x0 = 46, y0 = 14, w = W - x0 - 10, h = H - y0 - 48;
  const svg = K.svg(W, H, label);
  const sc = K.axes(svg, { x: x0, y: y0, w, h, xmin: 0, xmax: 1, ymin: 0, ymax: 1, yticks: [0, 0.25, 0.5, 0.75, 1], yfmt: (v) => v.toFixed(2), ylabel: "Frequency" });
  const gw = w / groups.length, bw = Math.min(34, gw / 4.2);
  groups.forEach((g, gi) => {
    const gx = x0 + gi * gw + gw / 2 - 1.5 * bw - 4;
    g.vals.forEach((v, k) => {
      const x = gx + k * (bw + 4);
      svg.append(s("rect", { class: g.cls ? g.cls[k] : "c" + GT[k], x, y: sc.sy(v), width: bw, height: sc.sy(0) - sc.sy(v) }));
      if (g.hw) svg.append(s("rect", { class: "hwbox", x: x - 1, y: sc.sy(g.hw[k]), width: bw + 2, height: sc.sy(0) - sc.sy(g.hw[k]) }));
      svg.append(s("text", { x: x + bw / 2, y: sc.sy(v) - 4, "text-anchor": "middle" }, v.toFixed(2)));
      svg.append(s("text", { x: x + bw / 2, y: y0 + h + 14, "text-anchor": "middle" }, g.labels ? g.labels[k] : GT[k]));
    });
    svg.append(s("text", { x: x0 + gi * gw + gw / 2, y: y0 + h + 32, "text-anchor": "middle", class: "lbl" }, g.name));
  });
  return svg;
}

function punnett(p) {
  const S = 180, svg = K.svg(S + 60, S + 66, "Punnett square of the gene pool: areas p², pq, pq, q²", "punnett", 1.1);
  const q = 1 - p, o = 40, a = S * p;
  const cell = (x, y, w, h, cls, t) => { svg.append(s("rect", { class: cls, x, y, width: w, height: h, stroke: "var(--surface)" })); if (w > 26 && h > 18) svg.append(s("text", { x: x + w / 2, y: y + h / 2 + 4, "text-anchor": "middle" }, t)); };
  cell(o, o, a, a, "cAA", "p²"); cell(o + a, o, S - a, a, "cAa", "pq"); cell(o, o + a, a, S - a, "cAa", "pq"); cell(o + a, o + a, S - a, S - a, "caa", "q²");
  const lab = (x, y, t, anchor) => svg.append(s("text", { x, y, "text-anchor": anchor || "middle", class: "lbl" }, t));
  lab(o + a / 2, o - 8, "A  " + p.toFixed(2)); lab(o + a + (S - a) / 2, o - 8, "a  " + q.toFixed(2));
  lab(o - 6, o + a / 2 + 4, "A", "end"); lab(o - 6, o + a + (S - a) / 2 + 4, "a", "end");
  lab(o + S / 2, o + S + 18, "eggs (top) × sperm (side)"); lab(o + S / 2, o + S + 34, "from one gene pool");
  return svg;
}

function simOffspring(C, n, seed) {
  const R = K.rng(seed); const c = [0, 0, 0];
  for (let i = 0; i < n; i++) { const a = R() < C.p, b = R() < C.p; c[a && b ? 0 : !a && !b ? 2 : 1]++; }
  return c.map((v) => v / n);
}

function generationsChart(C) {
  const W = 560, H = 250, x0 = 46, y0 = 12, w = W - x0 - 12, h = H - y0 - 50;
  const svg = K.svg(W, H, "Genotype frequencies (stacked) and p (line) over 11 generations");
  const sc = K.axes(svg, { x: x0, y: y0, w, h, xmin: -0.5, xmax: 10.5, ymin: 0, ymax: 1, xticks: [0, 2, 4, 6, 8, 10], yticks: [0, 0.5, 1], yfmt: (v) => v.toFixed(1), xlabel: "Generation (0 = the sample)", ylabel: "Frequency" });
  const par = C.x ? [C.nFAA / C.nF, C.nFAa / C.nF, C.nFaa / C.nF] : [C.nAA / C.N, C.nAa / C.N, C.naa / C.N];
  const hwv = CORE.hw(C.p);
  for (let g = 0; g <= 10; g++) {
    const v = g === 0 ? par : hwv; let acc = 0;
    v.forEach((f, k) => { svg.append(s("rect", { class: "c" + GT[k], x: sc.sx(g) - 14, y: sc.sy(acc + f), width: 28, height: sc.sy(acc) - sc.sy(acc + f), stroke: "var(--surface)", "stroke-width": 1 })); acc += f; });
  }
  svg.append(K.path([...Array(11).keys()].map((g) => [g, C.p]), sc, { class: "ln sink draw" }));
  svg.append(s("text", { x: sc.sx(10.4), y: sc.sy(C.p) - 6, "text-anchor": "end", class: "big" }, "p = " + C.p.toFixed(2)));
  return svg;
}

const UI = {
  eyebrow: "BISC 202 · Week 13 · Population genetics",
  title: "Gene-pool mixer",
  footer: ["Invented samples, generated fresh for each case. A is dominant to a."],
  brief(C) {
    if (C.x) return { q: "How common is the white-eye allele in this sample of fruit flies?", text: `A survey genotyped ${C.nF} females and ${C.nM} males for an X-linked gene. Xᴬ (red eyes) is dominant to Xᵃ (white eyes).`, given: `Females: XᴬXᴬ ${C.nFAA} · XᴬXᵃ ${C.nFAa} · XᵃXᵃ ${C.nFaa}   Males: XᴬY ${C.nMA} · XᵃY ${C.nMa}   · invented data` };
    return { q: `How common is each allele in this sample of ${C.org}?`, text: `${C.N} ${C.org} were genotyped for a gene affecting ${C.trait}. Allele A is dominant to allele a.`, given: `AA ${C.nAA} · Aa ${C.nAa} · aa ${C.naa} · N = ${C.N} · invented data` };
  },
  steps: [
    { task: (C) => C.x ? "Count the allele copies, remembering that males carry one X. Then calculate p, the frequency of Xᴬ." : "Count the allele copies in the sample, then calculate p, the frequency of A.",
      render(root, C, A, ctx) {
        const pan = el("div", { class: "panel" });
        pan.append(el("h2", null, "The sample"), peopleSVG(C, ctx.solved), K.legend([["gAA", "A copy"], ["gaa", "a copy"]]));
        const dis = ctx.solved;
        const f = (k) => ({ value: A[k], disabled: dis, mark: ctx.flag(k), onInput: (v) => { A[k] = v; ctx.change(); } });
        pan.append(el("div", { class: "nums" },
          K.number({ label: "Total allele copies", ...f("tot") }),
          K.number({ label: C.x ? "Copies of Xᴬ" : "Copies of A", ...f("ac") }),
          K.number({ label: C.x ? "p, frequency of Xᴬ" : "p, frequency of A", hint: "3 decimal places", ...f("p") })));
        root.append(pan);
      },
      win: (C) => `${CORE.aCopies(C)} of ${CORE.totalCopies(C)} copies are A, so p = ${C.p.toFixed(3)} and q = ${C.q.toFixed(3)}. Every copy now sits in one gene pool: who carried it no longer matters.`,
      winTitle: () => "Right: counted in copies" },
    { task: (C) => C.x ? "Suppose the population is at Hardy–Weinberg equilibrium with this q. What fraction of males, and of females, would have white eyes?" : "Every individual puts gametes into one gene pool and offspring form by random union of gametes. Predict the offspring's genotype frequencies.",
      render(root, C, A, ctx) {
        const pan = el("div", { class: "panel" });
        const W = 380, svg = K.svg(W, 56, `Gene pool: ${C.p.toFixed(2)} A, ${C.q.toFixed(2)} a`, "pool", 1.5);
        const x0 = 10, w = W - 20;
        svg.append(s("rect", { class: "A", x: x0, y: 8, width: w * C.p, height: 22 }), s("rect", { class: "a", x: x0 + w * C.p, y: 8, width: w * C.q, height: 22 }));
        svg.append(s("text", { x: x0, y: 46, class: "lbl" }, (C.x ? "Xᴬ  p = " : "A  p = ") + C.p.toFixed(3)), s("text", { x: x0 + w, y: 46, "text-anchor": "end", class: "lbl" }, (C.x ? "Xᵃ  q = " : "a  q = ") + C.q.toFixed(3)));
        pan.append(el("h2", null, "The gene pool"), svg);
        if (!C.x) pan.append(el("p", { class: "note" }, `The parents were ${C.nAA} AA, ${C.nAa} Aa and ${C.naa} aa: frequencies ${(C.nAA / C.N).toFixed(2)}, ${(C.nAa / C.N).toFixed(2)}, ${(C.naa / C.N).toFixed(2)}.`));
        const f = (k) => ({ value: A[k], disabled: ctx.solved, mark: ctx.flag(k), onInput: (v) => { A[k] = v; ctx.change(); } });
        pan.append(C.x
          ? el("div", { class: "nums" }, K.number({ label: "Fraction of males with white eyes", hint: "3 decimal places", ...f("men") }), K.number({ label: "Fraction of females with white eyes", hint: "3 decimal places", ...f("women") }))
          : el("div", { class: "nums" }, ...GT.map((g) => K.number({ label: "Offspring " + g, hint: "frequency, 3 decimal places", ...f(g) }))));
        root.append(pan);
      },
      reveal(root, C, A, ctx) {
        const pan = el("div", { class: "panel" });
        if (C.x) {
          pan.append(el("h2", null, "Males show q, females q²"), bars([
            { name: "Males", vals: [C.p, C.q], labels: ["XᴬY", "XᵃY"], cls: ["cAA", "caa"] },
            { name: "Females", vals: CORE.hw(C.p), labels: ["XᴬXᴬ", "XᴬXᵃ", "XᵃXᵃ"] }], "Expected genotype frequencies in each sex"),
            K.legend([["gaa", "white eyes (XᵃY, XᵃXᵃ)"], ["gAa", "carrier female"], ["gAA", "red eyes"]]),
            el("p", { class: "note" }, `Among males, ${(C.q * 100).toFixed(1)}% show the trait; among females only ${(C.q * C.q * 100).toFixed(1)}%. Carrier females (2pq) are ${(2 * C.p * C.q * 100).toFixed(1)}%.`));
        } else {
          let simSeed = C.simSeed;
          const chart = el("div");
          const draw = () => { K.clear(chart); chart.append(bars([
            { name: "Parents (the sample)", vals: [C.nAA / C.N, C.nAa / C.N, C.naa / C.N] },
            { name: "200 offspring, random mating", vals: simOffspring(C, 200, simSeed), hw: CORE.hw(C.p) }], "Parents against offspring")); };
          draw();
          const again = el("button", { class: "btn small" }, "Mate at random again");
          again.addEventListener("click", () => { simSeed++; draw(); });
          pan.append(el("h2", null, "One generation of random mating"), el("div", { class: "pair" }, el("div", { class: "pun" }, punnett(C.p)), el("div", { class: "pch" }, chart)),
            K.legend([["gAA", "AA"], ["gAa", "Aa"], ["gaa", "aa"], ["var(--ink)", "p², 2pq, q² (expected)", "dash"]]),
            el("div", { class: "row" }, again, el("span", { class: "note" }, "Each sample of 200 scatters around the dashed p², 2pq, q² outlines.")));
        }
        root.append(pan);
      },
      win: (C) => C.x ? `Males: q = ${C.q.toFixed(3)}. Females: q² = ${(C.q * C.q).toFixed(3)}. Recessive X-linked traits are far commoner in males.` : `p² = ${(C.p * C.p).toFixed(3)}, 2pq = ${(2 * C.p * C.q).toFixed(3)}, q² = ${(C.q * C.q).toFixed(3)}. The parents' genotypes did not matter: only the allele frequencies did.`,
      winTitle: (C) => C.x ? "Right: q in males, q² in females" : "Right: p², 2pq, q²" },
    { task: () => "Now look further ahead. Answer both questions.",
      render(root, C, A, ctx) {
        const pan = el("div", { class: "panel" });
        const R = K.rng(C.simSeed + 7);
        for (const q of CORE.Q3) {
          const opts = q.opts(C).map((o) => [R(), o]).sort((a, b) => a[0] - b[0]).map(([, o]) => ({ value: o[0], label: o[1] }));
          const marks = {}; if (ctx.solved) marks.ok = "right"; else if (ctx.flag(q.id)) marks[A[q.id]] = "flag";
          pan.append(K.choice({ legend: q.text(C), options: opts, value: A[q.id], disabled: ctx.solved, marks, onChange: (v) => { A[q.id] = v; ctx.change(); } }));
        }
        root.append(pan);
      },
      reveal(root, C) {
        root.append(el("div", { class: "panel" }, el("h2", null, "The null model: nothing changes"), generationsChart(C),
          K.legend([["gAA", C.x ? "XᴬXᴬ" : "AA"], ["gAa", C.x ? "XᴬXᵃ" : "Aa"], ["gaa", C.x ? "XᵃXᵃ" : "aa"], ["ink", "p", "line"]]),
          el("p", { class: "note" }, C.x ? "Females shown. With equal allele frequencies in both sexes, the population is at equilibrium and stays there." : "Generation 0 is the sample. One generation of random mating gives p², 2pq, q²; after that, with no force acting, nothing moves.")));
      },
      win: () => "Under the Hardy–Weinberg assumptions, allele frequencies stay put and genotype frequencies reach p², 2pq, q² in one generation. What changes them is a force: selection, drift, migration or mutation.",
      winTitle: () => "Right: the null model" },
  ],
  doneTitle: "Gene pool mixed",
  doneText: () => "Copies, not individuals; one gene pool; p², 2pq, q² after one generation; then nothing moves unless a force acts.",
  done(root, C) {
    const st = { AA: 0.5, Aa: 0, };
    const pan = el("div", { class: "panel" }, el("h2", null, "Explore: any starting population"),
      el("p", { class: "note" }, "Set the parents' genotype frequencies. The offspring of random mating depend only on p."));
    const out = el("div");
    const draw = () => {
      const aa = Math.max(0, 1 - st.AA - st.Aa), p = st.AA + st.Aa / 2;
      K.clear(out); out.append(el("div", { class: "readout" }, el("span", null, "aa = ", el("b", null, aa.toFixed(2))), el("span", null, "p = ", el("b", null, p.toFixed(3)))),
        bars([{ name: "Parents", vals: [st.AA, st.Aa, aa] }, { name: "Offspring (expected)", vals: CORE.hw(p), hw: CORE.hw(p) }], "Explore"));
    };
    const sAA = K.range({ label: "Parents AA", min: 0, max: 1, step: 0.01, value: st.AA, format: (v) => v.toFixed(2), onInput: (v) => { st.AA = Math.min(v, 1 - st.Aa); draw(); } });
    const sAa = K.range({ label: "Parents Aa", min: 0, max: 1, step: 0.01, value: st.Aa, format: (v) => v.toFixed(2), onInput: (v) => { st.Aa = Math.min(v, 1 - st.AA); draw(); } });
    pan.append(el("div", { class: "nums" }, sAA, sAa), out); draw();
    root.append(pan);
  },
};
Kit.run(CORE, UI);
})();
